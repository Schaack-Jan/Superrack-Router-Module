name: Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - companion/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release on Version Change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack (Yarn v4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: npm run test

      - name: Get current version from package.json
        id: pkg
        run: |
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Get latest release version
        id: rel
        run: |
          latest=$(gh release list --limit 1 | awk '{print $1}')
          echo "latest=$latest" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build package (.tgz)
        run: yarn package

      - name: Create release if version changed
        if: steps.pkg.outputs.version != steps.rel.outputs.latest
        run: |
          gh release create "${{ steps.pkg.outputs.version }}" --title "Release ${{ steps.pkg.outputs.version }}" --notes "Automated release for version ${{ steps.pkg.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload .tgz to release
        if: steps.pkg.outputs.version != steps.rel.outputs.latest
        run: |
          tgz_file=$(ls *.tgz | grep "${{ steps.pkg.outputs.version }}" | head -n1)
          gh release upload "${{ steps.pkg.outputs.version }}" "$tgz_file"
        env:
          GH_TOKEN: ${{ github.token }}
